<div class="page-header">
  <h1>Hambúrgueres</h1>
</div>

<app-tabela-pesquisa
  [colunas]="colunas"
  [dados]="hamburgueres()"
  [termo]="termo()"
  [carregando]="carregando()"
  textoVazio="Nenhum hambúrguer cadastrado."
  (termoChange)="buscar($event)"
  (novo)="novo()"
  [acoesTemplate]="acoes" />

<ng-template #acoes let-ham>
  <div class="row-end">
    <button type="button" class="btn btn-secondary btn-sm" (click)="editar(ham)">Editar</button>
    <button type="button" class="btn btn-danger btn-sm" (click)="paraExcluir.set(ham)">Excluir</button>
  </div>
</ng-template>

<app-confirmacao-dialog
  [aberto]="paraExcluir() !== null"
  [mensagem]="'Excluir o hambúrguer ' + (paraExcluir()?.codigo ?? '') + '?'"
  (confirmar)="confirmarExclusao()"
  (cancelar)="paraExcluir.set(null)" />
