services:
  db:
    image: postgres:16-alpine
    container_name: lanchonete-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-desafio_lanchonete_db}
      POSTGRES_USER: ${POSTGRES_USER:-lanchonete}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lanchonete}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../../banco/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lanchonete}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: lanchonete-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-desafio_lanchonete_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-lanchonete}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-lanchonete}
    ports:
      - "${BACKEND_PORT:-8082}:8082"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: lanchonete-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4222}:80"
    depends_on:
      - backend

volumes:
  db_data: